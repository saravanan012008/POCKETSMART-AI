{% extends 'base.html' %}{% block title %}Login — PocketSmart AI{% endblock %}{% block content %}<section class="authwrap"><div class="authbox"><div class="eyebrow">WELCOME BACK</div><h1>Log in to PocketSmart</h1><p class="muted">Continue your saved plans and recommendations.</p><form id="loginForm"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="btn primary full">Log in</button><div id="formError" class="error"></div></form><p class="switch">New here? <a href="/register">Create an account</a></p></div></section>{% endblock %}{% block scripts %}<script>document.getElementById('loginForm').addEventListener('submit',async(e)=>{e.preventDefault();const r=await api('/api/login','POST',Object.fromEntries(new FormData(e.target)));if(r.ok)location.href='/dashboard';else document.getElementById('formError').textContent=r.data.detail||'Login failed';});</script>{% endblock %}
