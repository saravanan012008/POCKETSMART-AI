{% extends 'base.html' %}{% block title %}Register — PocketSmart AI{% endblock %}{% block content %}<section class="authwrap"><div class="authbox"><div class="eyebrow">GET STARTED</div><h1>Create your PocketSmart account</h1><p class="muted">Save recommendations and revisit your plans anytime.</p><form id="registerForm"><label>Name<input name="name" required minlength="2"></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required minlength="8"><small>Use at least 8 characters.</small></label><button class="btn primary full">Create account</button><div id="formError" class="error"></div></form><p class="switch">Already registered? <a href="/login">Log in</a></p></div></section>{% endblock %}{% block scripts %}<script>document.getElementById('registerForm').addEventListener('submit',async(e)=>{e.preventDefault();const r=await api('/api/register','POST',Object.fromEntries(new FormData(e.target)));if(r.ok)location.href='/dashboard';else document.getElementById('formError').textContent=r.data.detail||'Registration failed';});</script>{% endblock %}
